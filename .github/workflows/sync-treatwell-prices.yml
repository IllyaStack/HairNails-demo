name: Sync Treatwell Prices

on:
  schedule:
    # Runs once every day at 05:15 UTC
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and update Treatwell minimum prices
        run: node scripts/update-treatwell-prices.mjs

      - name: Commit and push if prices changed
        run: |
          if git diff --quiet data/treatwell-prices.json; then
            echo "No price changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/treatwell-prices.json
            git commit -m "chore: sync Treatwell starting prices"
            git push
          fi
